build:
  name: InkDrive development IPA
  steps:
    - eas/checkout
    - eas/install_node_modules
    - run:
        name: Verify source
        command: |
          npm test
          npm run typecheck
    - run:
        name: Generate iOS project
        command: |
          npx expo prebuild --platform ios --clean --no-install
          cd ios
          pod install
    - run:
        name: Compile and package development IPA
        command: bash scripts/build-ios-development.sh
    - run:
        name: iPad simulator regression tests
        command: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available --json | python3 -c 'import sys,json; devices=[d for k,v in json.load(sys.stdin)["devices"].items() if "iOS" in k for d in v if "iPad" in d["name"]]; print(devices[0]["udid"])')
          cd modules/inkdrive/ios
          xcodebuild test -scheme InkDriveCore -sdk iphonesimulator -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -derivedDataPath ../../../build/core-tests CODE_SIGNING_ALLOWED=NO 2>&1 | tee ../../../build/native-tests.log
          xcrun xcresulttool export attachments --path ../../../build/core-tests/Logs/Test/*.xcresult --output-path ../../../build/native-attachments
    - eas/find_and_upload_build_artifacts
